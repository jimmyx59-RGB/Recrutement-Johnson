<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recrutement Discord</title>

  <style>
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  position: relative; /* IMPORTANT */

  background-color: #2f2f2f;

  display: flex;
  justify-content: center;
  align-items: center;
}

/* 🔥 FOND NOIR */
body::before {
  content: "";
  position: fixed; /* 👈 CHANGE */
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.3);
  z-index: -1; /* 👈 IMPORTANT */
}

/* 🔥 LOGO */
body::after {
  content: "";
  position: fixed; /* 👈 CHANGE */
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background: url("logo.png") no-repeat center center;
  background-size: 80%;

  opacity: 0.6;
  z-index: -2; /* 👈 DERRIÈRE */
}

.container {
  position: relative;
  z-index: 2; /* AU-DESSUS DE TOUT */
  background: #ffffff;
  padding: 30px;
  border-radius: 10px;
  width: 350px;
  box-shadow: 0 0 25px gold;
}

h1 {
  text-align: center;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  margin-top: 20px;
  width: 100%;
  padding: 10px;
  background-color: #5865F2;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background-color: #4752c4;
}

.success {
  margin-top: 15px;
  color: green;
  text-align: center;
  display: none;
}

.error {
  margin-top: 15px;
  color: red;
  text-align: center;
  display: none;
}
  </style>
</head>

<body>

<div class="container">
  <h1>Recrutement</h1>

  <form id="recrutementForm">
    <label>Pseudo Discord</label>
    <input type="text" id="pseudo" required>

    <label>Disponibilité</label>
    <textarea id="dispo" rows="4" required></textarea>

    <button type="submit">Envoyer</button>
  </form>

  <div class="success" id="successMsg">Candidature envoyée !</div>
  <div class="error" id="errorMsg">Erreur lors de l'envoi.</div>
</div>

<script>
  const WEBHOOK_URL = "https://discord.com/api/webhooks/1499888248582049852/vVJYew5XXdtZU_i2H0WdVzSgmEbjtrAT5IiXI296kb34G8Ei5poBFQdz_DB4T0rjobFN";

  document.getElementById('recrutementForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const pseudo = document.getElementById('pseudo').value;
    const dispo = document.getElementById('dispo').value;

    fetch(WEBHOOK_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        content: "📩 Nouvelle candidature\n👤 Pseudo: " + pseudo + "\n⏰ Disponibilité: " + dispo
      })
    })
    .then(response => {
      if (response.ok) {
        document.getElementById('successMsg').style.display = 'block';
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('recrutementForm').reset();
      } else {
        throw new Error("Erreur");
      }
    })
    .catch(error => {
      console.error(error);
      document.getElementById('errorMsg').style.display = 'block';
    });
  });
</script>

</body>
</html>
