<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recrutement Discord</title>

  <style>
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  position: relative;

  background-color: black;

  display: flex;
  justify-content: center;
  align-items: center;
}

/* FOND NOIR */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.3);
    z-index: -2;
}

/* LOGO */
body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: url("logo.png") no-repeat center;
    background-size: contain;
    background-color: black;

    opacity: 0.25;
    filter: blur(2px);

    z-index: -1;
}

.container {
  position: relative;
  z-index: 2;
  background: #ffffff;
  padding: 30px;
  border-radius: 10px;
  width: 350px;
  box-shadow: 0 0 25px gold;
}

h1 {
  text-align: center;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  margin-top: 20px;
  width: 100%;
  padding: 10px;
  background-color: #5865F2;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background-color: #4752c4;
}

.success {
  margin-top: 15px;
  color: green;
  text-align: center;
  display: none;
}

.error {
  margin-top: 15px;
  color: red;
  text-align: center;
  display: none;
}
  </style>
</head>

<body>

<div class="container">
  <h1>Recrutement</h1>

  <form id="recrutementForm">
    <label>Pseudo Discord</label>
    <input type="text" id="pseudo" required>

    <label>Disponibilité</label>
    <textarea id="dispo" rows="4" required></textarea>

    <button type="submit">Envoyer</button>
  </form>

  <div class="success" id="successMsg">
    Candidature envoyée !<br>
    👉 Rejoins le Discord : 
    <a href="https://discord.gg/TONLIEN" target="_blank">Clique ici</a>
  </div>

  <div class="error" id="errorMsg">Erreur lors de l'envoi.</div>
</div>

<script>
  const WEBHOOK_URL = "TON_WEBHOOK_ICI";

  const COOLDOWN = 5 * 60 * 1000; // 5 minutes

  document.getElementById('recrutementForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const now = Date.now();
    const lastSend = localStorage.getItem("lastSendTime");

    // 🔒 Anti-spam 5 min
    if (lastSend && now - lastSend < COOLDOWN) {
      const remaining = Math.ceil((COOLDOWN - (now - lastSend)) / 1000);
      document.getElementById('errorMsg').style.display = 'block';
      document.getElementById('errorMsg').innerText =
        "⏳ Attends encore " + remaining + " secondes avant de renvoyer.";
      return;
    }

    const pseudo = document.getElementById('pseudo').value;
    const dispo = document.getElementById('dispo').value;

    fetch(WEBHOOK_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        content: "📩 Nouvelle candidature\n👤 Pseudo: " + pseudo + "\n⏰ Disponibilité: " + dispo
      })
    })
    .then(response => {
      if (response.ok) {

        // Sauvegarde du cooldown
        localStorage.setItem("lastSendTime", now);

        document.getElementById('successMsg').style.display = 'block';
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('recrutementForm').reset();

        // Ouvre le Discord automatiquement
        window.open("https://discord.gg/CsUtCv2mbP", "_blank");

      } else {
        throw new Error("Erreur");
      }
    })
    .catch(error => {
      console.error(error);
      document.getElementById('errorMsg').style.display = 'block';
      document.getElementById('errorMsg').innerText = "Erreur lors de l'envoi.";
    });
  });
</script>

</body>
</html>
